<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Florería Díaz{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --crema: #f6f1e7;
            --crema-osc: #ece4d3;
            --oliva: #6b7156;
            --oliva-osc: #4c5140;
            --texto: #2e2c26;
            --texto-suave: #8a8577;
            --blanco: #fffdf8;
        }

        body {
            background-color: var(--crema);
            color: var(--texto);
            font-family: 'Jost', 'Segoe UI', Arial, sans-serif;
            font-weight: 300;
        }

        h1, h2, h3, h4, h5,
        .font-serif {
            font-family: 'Playfair Display', Georgia, serif;
            font-weight: 500;
            letter-spacing: 0.01em;
        }

        a { color: var(--oliva-osc); }
        a:hover { color: var(--oliva); }

        .navbar-floreria {
            background-color: var(--crema);
            border-bottom: 1px solid var(--crema-osc);
        }
        .navbar-floreria .navbar-brand {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.5rem;
            color: var(--texto) !important;
            letter-spacing: 0.02em;
        }
        .navbar-floreria .nav-link {
            color: var(--texto) !important;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 400;
        }
        .navbar-floreria .nav-link:hover {
            color: var(--oliva) !important;
        }

        .hero {
            position: relative;
            background-color: var(--crema-osc);
            background-size: cover;
            background-position: center 72%;
            min-height: 380px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            overflow: hidden;
            isolation: isolate;
        }
        .hero.con-imagen {
            color: #fdfaf3;
        }
        .hero.con-imagen::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(46,44,38,0.35), rgba(46,44,38,0.55));
            z-index: -1;
        }
        .hero.con-imagen .categoria-tag {
            color: rgba(253, 250, 243, 0.8);
        }
        .hero.con-imagen p.lead {
            color: rgba(253, 250, 243, 0.92) !important;
        }

        .card-producto {
            border: none;
            border-radius: 4px;
            background-color: var(--blanco);
            box-shadow: 0 2px 14px rgba(46, 44, 38, 0.06);
            height: 100%;
            overflow: hidden;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .card-producto:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 22px rgba(46, 44, 38, 0.12);
        }
        .img-wrap {
            aspect-ratio: 4 / 3;
            background-color: var(--crema-osc);
            overflow: hidden;
        }
        .img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .img-wrap .sin-imagen {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--texto-suave);
            font-size: 1.8rem;
        }

        .categoria-tag {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--texto-suave);
        }

        .precio-tag {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.1rem;
            color: var(--oliva-osc);
        }

        .btn-floreria, .btn-pill {
            background-color: var(--oliva-osc);
            border: 1px solid var(--oliva-osc);
            color: var(--blanco) !important;
            border-radius: 50px;
            padding: 0.5rem 1.4rem;
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .btn-floreria:hover, .btn-pill:hover {
            background-color: var(--oliva);
            border-color: var(--oliva);
            color: var(--blanco) !important;
        }
        .btn-pill-outline {
            background-color: transparent;
            border: 1px solid var(--texto-suave);
            color: var(--texto) !important;
            border-radius: 50px;
            padding: 0.5rem 1.4rem;
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .btn-pill-outline:hover {
            border-color: var(--oliva-osc);
            color: var(--oliva-osc) !important;
        }
        .btn-pill-danger {
            background-color: transparent;
            border: 1px solid #a6564f;
            color: #a6564f !important;
            border-radius: 50px;
            padding: 0.5rem 1.4rem;
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .btn-pill-danger:hover {
            background-color: #a6564f;
            color: var(--blanco) !important;
        }
        .btn-sm.btn-pill, .btn-sm.btn-pill-outline, .btn-sm.btn-pill-danger {
            padding: 0.3rem 0.9rem;
            font-size: 0.72rem;
        }

        .badge-disponible {
            background-color: var(--oliva);
            font-weight: 400;
            letter-spacing: 0.04em;
        }
        .badge-agotado {
            background-color: #a6564f;
            font-weight: 400;
            letter-spacing: 0.04em;
        }

        .form-control, .form-select {
            border-radius: 2px;
            border-color: var(--crema-osc);
            background-color: var(--blanco);
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--oliva);
            box-shadow: 0 0 0 0.2rem rgba(107, 113, 86, 0.15);
        }
        .form-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--texto-suave);
        }

        .panel {
            background-color: var(--blanco);
            border-radius: 4px;
            box-shadow: 0 2px 14px rgba(46, 44, 38, 0.06);
        }

        footer {
            color: var(--texto-suave);
            font-size: 0.8rem;
            letter-spacing: 0.03em;
            border-top: 1px solid var(--crema-osc);
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-floreria mb-5 py-3">
    <div class="container">
        <a class="navbar-brand" href="{% url 'index' %}">Florería Díaz</a>
        <div class="d-flex gap-4">
            <a class="nav-link" href="{% url 'index' %}">Inicio</a>
            <a class="nav-link" href="{% url 'listado_productos' %}">Productos</a>
            <a class="nav-link" href="{% url 'crear_producto' %}">Nuevo producto</a>
        </div>
    </div>
</nav>

<div class="container pb-5">
    {% block content %}{% endblock %}
</div>

<footer class="text-center py-4 mt-4">
    Florería Díaz &middot; Proyecto Django + MySQL
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
